server:
  port: 8000
  servlet:
    context-path: /marketplace-api
  address: 0.0.0.0
spring:
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: true
  application:
    name: marketplace-api
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${POSTGRES_USER:-postgres}
    password: ${POSTGRES_PASSWORD:-postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  sql:
    init:
      mode: always
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    enabled: true
    user: ${POSTGRES_USER:-postgres}
    password: ${POSTGRES_PASSWORD:-postgres}
    baseline-description: "init migration"
    baseline-version: 0
    locations: classpath:db/migration
  main:
    allow-circular-references: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/marketplace
  docker:
    compose:
      file: docker-compose.yml
      lifecycle-management: start_and_stop
management:
  appoptics:
    metrics:
      export:
        enabled: true
logging:
  level:
    com.fasterxml.jackson: DEBUG
    org.thymeleaf: DEBUG
    com.marketplace: DEBUG
    web: DEBUG
    org:
      springframework:
        security: DEBUG # or trace